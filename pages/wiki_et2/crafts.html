<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crafts — Wiki ET2 | CNX Apps</title>
  <meta name="theme-color" content="#07070f" />
  <link rel="icon" type="image/x-icon" href="../../favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Raleway:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="../../css/cnx_new.css" />
  <style>
    .sec-divider-et2 { background: linear-gradient(90deg, transparent, var(--et2), transparent); }
    .wiki-page-hero { padding: 7rem 1.5rem 3rem; text-align: center; background: var(--bg-medium); }
    .wiki-page-hero h1 { font-family: 'Cinzel', serif; font-size: clamp(1.8rem, 4vw, 3rem); color: var(--text-primary); margin-bottom: 0.5rem; }
    .wiki-page-hero p { color: var(--text-secondary); max-width: 560px; margin: 0 auto; }
    .wiki-content { padding: 4rem 0; min-height: 50vh; }
    .wiki-placeholder { background: var(--bg-card); border: 1px dashed rgba(139,92,246,0.3); border-radius: 10px; padding: 3rem 2rem; text-align: center; color: var(--text-secondary); }
  </style>
</head>
<body>
  <nav id="navbar">
    <a href="../../index.html" class="nav-brand"><img src="../../img/logo-white.png" alt="CNX Apps" /><span class="nav-brand-name">CNX Apps</span></a>
    <ul class="nav-links">
      <li><a href="index.html">← Wiki</a></li>
      <li><a href="criaturas.html" data-i18n="nav.creatures">Criaturas</a></li>
      <li><a href="cidades.html" data-i18n="nav.cities">Cidades</a></li>
      <li><a href="itens.html" data-i18n="nav.items">Itens</a></li>
    </ul>
    <button class="nav-toggle" id="navToggle" aria-label="Menu"><span></span><span></span><span></span></button>
  </nav>
  <div class="nav-overlay" id="navOverlay">
    <button class="nav-close" id="navClose">&times;</button>
    <a href="index.html" onclick="closeNav()">← Wiki</a>
    <a href="criaturas.html" onclick="closeNav()" data-i18n="nav.creatures">Criaturas</a>
    <a href="cidades.html" onclick="closeNav()" data-i18n="nav.cities">Cidades</a>
    <a href="itens.html" onclick="closeNav()" data-i18n="nav.items">Itens</a>
  </div>

  <section class="wiki-page-hero">
    <div class="sec-container" data-aos="fade-up">
      <span class="sec-tag"><i class="fa-solid fa-hammer"></i> Wiki</span>
      <h1 data-i18n="nav.crafts">Crafts</h1>
      <hr class="sec-divider sec-divider-et2" />
      <p data-i18n="wiki.crafts_desc">Receitas e combinações de crafting em Endless Tales 2.</p>
      <p id="wiki-total-count" class="wiki-table-count" style="margin-top:0.5rem;"></p>
    </div>
  </section>

  <hr class="section-sep" />
  <section class="wiki-content wiki-content-wide">
    <div class="sec-container">
      <h3 style="color:var(--text-primary); font-family:'Cinzel',serif; margin-bottom:1rem;" data-aos="fade-up">🍳 <span data-i18n="wiki.cooking_title">Culinária</span></h3>
      <div id="wiki-table-cooking" data-aos="fade-up"></div>

      <h3 style="color:var(--text-primary); font-family:'Cinzel',serif; margin:2rem 0 1rem;" data-aos="fade-up">🔨 <span data-i18n="wiki.general_title">Artesanato</span></h3>
      <div id="wiki-table-general" data-aos="fade-up"></div>

      <h3 style="color:var(--text-primary); font-family:'Cinzel',serif; margin:2rem 0 1rem;" data-aos="fade-up">⚗️ <span data-i18n="wiki.alchemy_title">Alquimia</span></h3>
      <div id="wiki-table-alchemy" data-aos="fade-up"></div>
    </div>
  </section>

  <hr class="section-sep" />
  <footer><div class="footer-bottom"><div class="sec-container"><p>Copyright &copy; 2025 &mdash; <strong>CNX Apps</strong> &middot; Calvin R. Nunes</p></div></div></footer>
  <script src="../../js/jquery-3.4.1.min.js"></script>
  <script src="../../js/translator.js"></script>
  <script src="../../js/i18n.js"></script>
  <script src="../../js/wiki-lightbox.js"></script>
  <script src="../../js/wiki-crafts.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js" crossorigin="anonymous"></script>
  <script>
    AOS.init({ duration: 700, once: true, offset: 60 });
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => navbar.classList.toggle('scrolled', window.scrollY > 60));
    document.getElementById('navToggle').addEventListener('click', () => document.getElementById('navOverlay').classList.add('open'));
    document.getElementById('navClose').addEventListener('click', () => document.getElementById('navOverlay').classList.remove('open'));
    function closeNav() { document.getElementById('navOverlay').classList.remove('open'); }
    jQuery(document).ready(function() {
      WikiCrafts.render('../../js/wiki_data_crafts.json');
    });
  </script>
</body>
</html>
